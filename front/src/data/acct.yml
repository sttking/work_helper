semantic_models:
  - name: acct
    model: ref('dim_acct')
    description: 계좌 정보 (trsc/amt 공통 참조)
    entities:
      - name: acct
        type: primary
        expr: acct

    dimensions:
      - name: view_dv
        type: categorical
        description:
          계좌 구분. 가능한 값 = [수시, 예적금, 대출, 증권, 신탁, 퇴직연금]이며 특별히 발화되지 않으면 수시가 기본값. "다", "전체"가 들어가는 경우 이 값은 조건에 포함시키지 마세요.
          예시) "어제 잔액이랑 오늘 잔액 비교 해줘" => 특별히 계좌 구분과 관련된 발화가 없으므로 "수시", "내 전체 계좌 중 잔고없는 계좌 보여줘" => "전체 계좌"라는 발화가 들어 있으므로 view_dv 조건은 넣지 않습니다.
      - name: com_nm
        type: categorical
        description: 회사명. 사용자의 회사명이 올수 있고 특별히 발화되지 않으면 넣지 마세요.
      - name: bank_nm
        type: categorical
        description: 은행명. 검색은 like 검색이 필수. 가능한 값 = [농협, 신한, 우리, 하나, 국민, 기업, 카카오뱅크, 케이뱅크, 토스뱅크]. 반드시 가능한 값 중에 선택해 주세요. 예시) "오늘 농협은행 거래 내역은" => bank_nm = '농협', "오늘 신한은행 거래 내역은" => bank_nm = '신한'
      - name: acct_no
        type: categorical
        description: 계좌번호.  검색은 like 검색이 필수
      - name: curr_cd
        type: categorical
        description:
          통화 구분. 가능한 값 = [KRW, USD, JPY 등] 통화 종류가 명시되지 않은 경우  acct__curr_cd = KRW 조건을 추가. "다", "전체"가 들어가는 경우 이 값은 조건에 포함시키지 마세요.
          예시) "오늘 농협은행 거래 내역은" => 통화 구분 관련 발화가 없으므로 "KRW", '은행별 잔액 다 보여줘' => '다 보여줘'라는 발화가 들어 있으므로 curr_cd 조건은 넣지 않습니다.
